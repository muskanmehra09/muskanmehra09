<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0014"/>
      <stop offset="45%" stop-color="#120024"/>
      <stop offset="100%" stop-color="#01040a"/>
    </linearGradient>

    <linearGradient id="neonText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="50%" stop-color="#b026ff"/>
      <stop offset="100%" stop-color="#ff2ec4"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="neonGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b1"/>
      <feMerge>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softBlur2" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="url(#bg2)"/>

  <!-- hexagon grid pattern -->
  <g stroke="#00f5ff" stroke-opacity="0.12" fill="none">
    <polygon points="60,20 100,40 100,80 60,100 20,80 20,40"/>
    <polygon points="140,20 180,40 180,80 140,100 100,80 100,40"/>
    <polygon points="1060,320 1100,340 1100,380 1060,400 1020,380 1020,340"/>
    <polygon points="980,320 1020,340 1020,380 980,400 940,380 940,340"/>
    <polygon points="60,320 100,340 100,380 60,400 20,380 20,340"/>
    <polygon points="1140,20 1180,40 1180,80 1140,100 1100,80 1100,40"/>
  </g>

  <!-- horizontal scan line moving down -->
  <rect x="0" y="0" width="1200" height="3" fill="#00f5ff" opacity="0.35" filter="url(#neonGlow)">
    <animate attributeName="y" values="0;420;0" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- drifting glow orbs -->
  <circle cx="150" cy="120" r="90" fill="#b026ff" opacity="0.10" filter="url(#softBlur2)">
    <animate attributeName="cy" values="120;150;120" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1050" cy="300" r="110" fill="#00f5ff" opacity="0.09" filter="url(#softBlur2)">
    <animate attributeName="cy" values="300;260;300" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- floating diamond particles -->
  <g fill="#ff2ec4">
    <rect x="90" y="70" width="6" height="6" transform="rotate(45 93 73)">
      <animate attributeName="y" values="70;40;70" dur="3.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="1100" y="90" width="5" height="5" fill="#00f5ff" transform="rotate(45 1102 92)">
      <animate attributeName="y" values="90;120;90" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="250" y="330" width="5" height="5" fill="#b026ff" transform="rotate(45 252 332)">
      <animate attributeName="y" values="330;300;330" dur="3.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="950" y="340" width="6" height="6" fill="#ff2ec4" transform="rotate(45 953 343)">
      <animate attributeName="y" values="340;370;340" dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- hexagon wireframe orbiting motif (replaces cube, distinct shape) -->
  <g transform="translate(1000,150)">
    <g stroke="#00f5ff" stroke-width="1.4" fill="none" opacity="0.8" filter="url(#softBlur2)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
        <polygon points="0,-55 48,-27 48,27 0,55 -48,27 -48,-27"/>
        <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" stroke="#ff2ec4"/>
      </g>
    </g>
  </g>

  <!-- radar sweep circle (left side) -->
  <g transform="translate(160,260)">
    <circle r="55" fill="none" stroke="#b026ff" stroke-width="1" opacity="0.5"/>
    <circle r="35" fill="none" stroke="#b026ff" stroke-width="1" opacity="0.4"/>
    <line x1="0" y1="0" x2="55" y2="0" stroke="#00f5ff" stroke-width="2" opacity="0.8" filter="url(#neonGlow)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- title: bold condensed sans font, different from previous serif-monospace look -->
  <text x="600" y="190" text-anchor="middle" font-family="'Trebuchet MS', 'Segoe UI', Arial, sans-serif" font-size="62" font-weight="900" letter-spacing="4" fill="url(#neonText)" filter="url(#neonGlow)">
    MUSKAN MEHRA
  </text>

  <text x="600" y="235" text-anchor="middle" font-family="'Trebuchet MS', Arial, sans-serif" font-size="19" font-weight="600" letter-spacing="6" fill="#00f5ff" opacity="0.9">
    SOLUTIONS ENGINEER // QUANT // AI-ML
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.2s" repeatCount="indefinite"/>
  </text>

  <text x="600" y="270" text-anchor="middle" font-family="'Trebuchet MS', Arial, sans-serif" font-size="14" letter-spacing="2" fill="#ff2ec4" opacity="0.85">
    ⟡ building NeuroVox-9 — decoding voice into emotion ⟡
  </text>

  <!-- animated underline bar -->
  <rect x="450" y="300" width="300" height="3" fill="#b026ff" filter="url(#neonGlow)">
    <animate attributeName="width" values="0;300;300;0" keyTimes="0;0.4;0.6;1" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="x" values="600;450;450;600" keyTimes="0;0.4;0.6;1" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>
