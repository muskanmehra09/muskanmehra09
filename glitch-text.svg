<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 90" width="100%" height="90">
<defs>
  <style>
    .glitch-base {
      font-family: 'Fira Code', monospace;
      font-size: 34px;
      font-weight: 700;
    }
  </style>
</defs>
<rect x="0" y="0" width="900" height="90" fill="#000000"/>

<text class="glitch-base" x="50%" y="55%" text-anchor="middle" fill="#ff0040" opacity="0.85">
  &gt; ACCESS_GRANTED :: MUSKAN.EXE
  <animate attributeName="x" values="50%;49.3%;50.6%;50%" dur="0.25s" repeatCount="indefinite" begin="0s"/>
</text>
<text class="glitch-base" x="50%" y="55%" text-anchor="middle" fill="#00fff9" opacity="0.85">
  &gt; ACCESS_GRANTED :: MUSKAN.EXE
  <animate attributeName="x" values="50%;50.7%;49.4%;50%" dur="0.3s" repeatCount="indefinite" begin="0.05s"/>
</text>
<text class="glitch-base" x="50%" y="55%" text-anchor="middle" fill="#00FF41">
  &gt; ACCESS_GRANTED :: MUSKAN.EXE
  <animate attributeName="opacity" values="1;1;0.2;1;1;0.4;1" dur="2.4s" repeatCount="indefinite"/>
</text>
</svg>
